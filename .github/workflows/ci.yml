name: Website CI

on:
  push:
    branches: [main, testing, develop, 'dev/**']
  pull_request:
    branches: [main, testing, develop, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun --no-env-file install --frozen-lockfile

      - name: Verify exact Bun toolchain
        run: test "$(bun --version)" = '1.4.0'

      - name: Audit production and build dependencies
        run: scripts/audit-dependencies.sh

      - name: Build website
        run: bun --no-env-file run build

  validate-image:
    name: Validate deployable image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build through the canonical repository entry point
        run: ENV_FILE=.env.example scripts/build.sh

  package-candidate:
    name: Package untagged candidate
    if: github.event_name == 'workflow_dispatch'
    needs: [build, validate-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and package verified image
        run: scripts/package-image.sh "$RUNNER_TEMP/candidate"

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cashlenx-website-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14
