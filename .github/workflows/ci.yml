name: Website CI

on:
  push:
    branches: [main, testing, develop, 'dev/**']
  pull_request:
    branches: [main, testing, develop, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and build dependencies
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build

  package-candidate:
    name: Package untagged candidate
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and package verified image
        run: scripts/package-image.sh "$RUNNER_TEMP/candidate"

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cashlenx-website-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14
